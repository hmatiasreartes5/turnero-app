name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turnero-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: turnero-app/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npx tsc -b --noEmit
        name: Typecheck

      - run: npm run test

      - run: npm run build
